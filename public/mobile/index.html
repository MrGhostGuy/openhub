<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OpenHub">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains">
<title>OpenHub</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<script>
(function(){if(location.protocol==='http:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1'){location.replace('https://'+location.host+location.pathname);}})();
</script>
<canvas id="particleBg"></canvas>
<div class="scanlines"></div>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo-wrap"><div class="logo">OH</div><div class="logo-ring"></div></div>
      <div class="brand-text"><h1>OPENHUB</h1><span class="brand-sub" id="brandSub">AI Control Center</span></div>
    </div>
    <div class="topbar-right">
      <div class="status-pill" id="connPill"><span class="dot"></span><span id="connText">...</span></div>
      <button class="refresh-btn" onclick="window._oh.refresh()" title="Refresh">⟳</button>
    </div>
  </header>
  <main class="view" id="view">
    <div class="loading"><div class="loader-ring"><div></div><div></div><div></div><div></div></div><span>INITIALIZING</span></div>
  </main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<script src="games.js"></script>
<script src="app.js"></script>
</body>
</html>
